name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Committed build output is up to date
        run: |
          npm run build
          if ! git diff --quiet -- assets vendor; then
            echo "::error::assets/ or vendor/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- assets vendor
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t spindecide:ci .

      - name: Smoke test container
        run: |
          docker run -d --name spindecide -p 8080:80 spindecide:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<title>SpinDecide</title>'
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy: default-src 'self'"
          curl -fsS -o /dev/null http://localhost:8080/assets/app.js
          curl -fsS -o /dev/null http://localhost:8080/vendor/lucide/lucide.min.js
          docker rm -f spindecide
