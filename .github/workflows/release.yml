name: Release

# Builds spindecide-vX.Y.Z.zip (plus a .sha256 checksum) and attaches it to the
# GitHub Release for a version tag. Works however the release is made:
#
#   - Release created on github.com (Releases → Draft a new release → Publish):
#     the "release: published" event attaches the zip to it. Your notes are kept.
#   - Tag pushed from the command line:
#       git tag -a v1.3.0 -m "SpinDecide 1.3.0" && git push origin v1.3.0
#     creates the release with notes from CHANGELOG.md, then attaches the zip.
#   - Run manually (Actions → Release → Run workflow) with a tag, to (re)attach
#     the zip to an existing release.
#
# The tag must match package.json "version", and CHANGELOG.md must have a
# "## [x.y.z]" section for it.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and attach, e.g. v1.3.0'
        required: true
        type: string

permissions:
  contents: write

# A release made on github.com can fire both the tag push and the release event.
# Runs for the same tag queue behind each other; the second one re-uploads the
# same files, which is harmless.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Validate tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check version consistency
        run: |
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$PKG" = "$VERSION" ] || { echo "::error::Tag $TAG does not match package.json version $PKG"; exit 1; }
          UI="v${VERSION%.*}"
          grep -q ">${UI}</span>" index.html || { echo "::error::index.html does not show $UI in the header"; exit 1; }
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"; exit 1; }

      - name: Committed build output is up to date
        run: |
          npm run build
          git diff --quiet -- assets vendor || { echo "::error::assets/ or vendor/ is out of date"; exit 1; }

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npx playwright test

      - name: Package the deployable app
        run: |
          mkdir -p dist/spindecide
          cp -r index.html assets vendor LICENSE README.md CHANGELOG.md dist/spindecide/
          cd dist
          zip -qr "spindecide-${TAG}.zip" spindecide
          sha256sum "spindecide-${TAG}.zip" > "spindecide-${TAG}.zip.sha256"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Download"
            echo "\`spindecide-${TAG}.zip\` contains the ready-to-host app (\`index.html\`, \`assets/\`, \`vendor/\`). Unzip it and open \`index.html\`, or serve the folder from any static host. See the README for Docker and GitHub Pages."
          } >> notes.md
          cat notes.md

      - name: Create the release if needed, then attach the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; keeping its title and notes."
          else
            gh release create "$TAG" \
              --title "SpinDecide ${TAG}" \
              --notes-file notes.md \
              --verify-tag
          fi
          # --clobber replaces files of the same name, so re-runs are safe.
          gh release upload "$TAG" \
            "dist/spindecide-${TAG}.zip" \
            "dist/spindecide-${TAG}.zip.sha256" \
            --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
